name: Release
on:
  push:
    branches:
      - main
    paths-ignore:
      - "Formula/**"
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            next="v1.5.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --generate-notes
      - env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          SHA="$(curl -fsSL --retry 5 --retry-delay 5 "$URL" | shasum -a 256 | awk '{print $1}')"
          URL="$URL" SHA="$SHA" FORMULA_PATH="Formula/sand.rb" python3 .github/workflows/patch-formula-url.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sand.rb
          git commit -m "Update formula to ${TAG}"
          git push origin HEAD:main
